<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Photo Booth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213D;
    --paper: #FFFFFF;
    --flash: #FFF8E7;
    --booth: #E63946;
    --ok: #3DDC97;
    --warn: #FFB703;
    --font: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--ink); color: var(--paper); font-family: var(--font); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: var(--ink); }
  #cam.rear { transform: none; }

  /* ปุ่มถ่าย */
  #shutter {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
    width: 96px; height: 96px; margin-left: -48px; border-radius: 50%;
    border: 6px solid var(--paper); background: var(--booth); cursor: pointer;
    box-shadow: 0 0 0 6px rgba(20,33,61,.35);
    transition: transform .12s ease;
  }
  #shutter:active { transform: scale(.92); }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 144px);
    text-align: center; font-weight: 800; font-size: 22px; text-shadow: 0 2px 10px rgba(20,33,61,.8);
  }

  /* นับถอยหลัง */
  #count { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-weight: 800; font-size: min(55vw, 55vh); text-shadow: 0 6px 30px rgba(20,33,61,.7); pointer-events: none; }
  #count.on { display: flex; }
  #count span { animation: pop .9s ease-out; }
  @keyframes pop { from { transform: scale(1.5); opacity: 0; } 25% { opacity: 1; } to { transform: scale(.9); opacity: .9; } }

  /* แฟลช */
  #flash { position: fixed; inset: 0; background: var(--flash); opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* หน้าผลลัพธ์ + เลขคิว */
  #result { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; background: var(--booth); text-align: center; }
  #result.on { display: flex; }
  #shot { width: min(38vw, 220px); aspect-ratio: 3 / 4; object-fit: cover; border: 6px solid var(--paper); border-radius: 6px; box-shadow: 0 8px 24px rgba(20,33,61,.35); }
  #rlabel { font-size: 24px; font-weight: 500; }
  #rnum { font-size: min(30vw, 30vh); font-weight: 800; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  #rnote { font-size: 20px; font-weight: 500; min-height: 1.5em; }

  /* สถานะมุมจอ (สำหรับพนักงาน) */
  #chip { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(20,33,61,.7); font-size: 14px; font-weight: 500; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  #dot.wait { background: var(--warn); }
  #dot.bad { background: var(--booth); }

  /* ปุ่มสลับกล้องหน้า/หลัง */
  #flip { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(20,33,61,.7); color: var(--paper); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #flip:active { transform: scale(.92); }
  #flip:disabled { opacity: .35; }
  #flip svg { width: 28px; height: 28px; }

  /* error */
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; background: var(--ink); font-size: 22px; line-height: 1.6; }
  #err.on { display: flex; }

  @media (prefers-reduced-motion: reduce) {
    #count span, #flash.go { animation-duration: .01s; }
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>

<div id="chip"><span id="dot"></span><span id="chiptext">กำลังเริ่ม...</span></div>
<button id="flip" aria-label="สลับกล้องหน้า/หลัง">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3.5l-1.5-2h-6L7.5 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13.5a3.2 3.2 0 0 1 5.6-2.1M15 13.5a3.2 3.2 0 0 1-5.6 2.1"/><path d="M14.8 9.8v1.8h-1.8M9.2 17.2v-1.8h1.8"/></svg>
</button>
<div id="hint">กดปุ่มเพื่อถ่ายรูป</div>
<button id="shutter" aria-label="ถ่ายรูป"></button>

<div id="count"><span id="countnum"></span></div>
<div id="flash"></div>

<div id="result">
  <img id="shot" alt="รูปที่ถ่าย">
  <div id="rlabel">คิวของคุณ</div>
  <div id="rnum">…</div>
  <div id="rnote">กำลังจองคิว</div>
</div>

<div id="err"><div id="errtext"></div></div>

<canvas id="canvas" hidden></canvas>

<script>
// ====== ตั้งค่า ======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySwTMl1vVA4K1I3vwBLxq77ZdbiDXG-OcgKrE4jfoTSaZtq4neSUrISwYiRJUzyboV/exec'; // ลิงก์ Web App ที่ลงท้ายด้วย /exec
const MAX_SIDE = 2000;        // ย่อด้านยาวสุดเหลือกี่ px
const JPEG_QUALITY = 0.88;
const COUNTDOWN_FROM = 3;     // นับถอยหลังกี่วินาที (ตั้ง 0 = ไม่นับ)
const RESULT_HOLD_MS = 5000;  // โชว์เลขคิวหลังได้เลขแล้วกี่ ms
const RESULT_MAX_WAIT_MS = 12000; // รอเลขนานสุดกี่ ms ก่อนกลับไปหน้ากล้อง (อัปโหลดต่อเบื้องหลัง)

// ====== องค์ประกอบ ======
const $ = id => document.getElementById(id);
const cam = $('cam'), canvas = $('canvas'), shutter = $('shutter');
let facing = 'user';
try { if (localStorage.getItem('boothFacing') === 'environment') facing = 'environment'; } catch (e) {}
let stream = null;
let busy = false;           // ระหว่างนับ/ถ่าย/โชว์ผล
let currentJobId = null;    // งานที่หน้าผลลัพธ์กำลังรอเลข
let lastQueue = null;
const jobs = [];
let pumping = false;
let lastErr = '';

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ====== กล้อง ======
async function startCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    cam.srcObject = stream;
    cam.classList.toggle('rear', facing === 'environment');
    try { localStorage.setItem('boothFacing', facing); } catch (e) {}
    $('err').classList.remove('on');
    updateChip();
  } catch (e) {
    if (facing === 'environment') { facing = 'user'; return startCamera(); } // กล้องหลังเปิดไม่ได้ -> กลับกล้องหน้า
    showError('เปิดกล้องไม่ได้<br>กรุณากด "อนุญาต" การใช้กล้อง แล้วรีเฟรชหน้านี้');
  }
}
function showError(html) { $('errtext').innerHTML = html; $('err').classList.add('on'); }

async function keepAwake() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); startCamera(); }
});

// กดค้างที่ชิปสถานะ 1.5 วินาที = สลับกล้องหน้า/หลัง (สำหรับพนักงาน)
let holdTimer = null;
$('chip').addEventListener('pointerdown', () => {
  holdTimer = setTimeout(() => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); }, 1500);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
  $('chip').addEventListener(ev, () => clearTimeout(holdTimer)));

// ปุ่มสลับกล้องหน้า/หลัง
$('flip').addEventListener('click', () => {
  if (busy) return;
  facing = facing === 'user' ? 'environment' : 'user';
  startCamera();
});

// ====== ถ่ายรูป ======
shutter.addEventListener('click', async () => {
  if (busy || !stream) return;
  busy = true;
  shutter.disabled = true;
  $('hint').style.visibility = 'hidden';

  if (COUNTDOWN_FROM > 0) {
    $('count').classList.add('on');
    for (let n = COUNTDOWN_FROM; n >= 1; n--) {
      const el = $('countnum');
      el.textContent = n;
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      await sleep(1000);
    }
    $('count').classList.remove('on');
  }

  const dataUrl = capture();
  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');

  const job = { id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
                image: dataUrl.split(',')[1], tries: 0, queue: null };
  jobs.push(job);
  pump();
  showResult(job, dataUrl);
});

function capture() {
  const w = cam.videoWidth, h = cam.videoHeight;
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(cam, 0, 0, canvas.width, canvas.height); // เซฟแบบไม่กลับด้าน (ตัวหนังสือในรูปไม่กลับ)
  return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
}

// ====== หน้าผลลัพธ์ ======
function showResult(job, dataUrl) {
  currentJobId = job.id;
  $('shot').src = dataUrl;
  $('rnum').textContent = '…';
  $('rnote').textContent = 'กำลังจองคิว';
  $('result').classList.add('on');

  setTimeout(() => {
    if (currentJobId === job.id && !job.queue) backToCamera(); // รอนานเกิน -> กลับไปรอคนต่อไป ส่งต่อเบื้องหลัง
  }, RESULT_MAX_WAIT_MS);
}
function onQueueIssued(job) {
  if (currentJobId !== job.id) return;
  $('rnum').textContent = '#' + job.queue;
  $('rnote').textContent = 'จดเลขนี้ไว้ใช้รับรูปวาด';
  setTimeout(() => { if (currentJobId === job.id) backToCamera(); }, RESULT_HOLD_MS);
}
function backToCamera() {
  currentJobId = null;
  $('result').classList.remove('on');
  $('hint').style.visibility = 'visible';
  shutter.disabled = false;
  busy = false;
}

// ====== อัปโหลดเบื้องหลัง (ลองใหม่เรื่อยๆ ถ้าเน็ตหลุด ใช้ clientId เดิมเพื่อกันเลขซ้ำ) ======
async function pump() {
  if (pumping) return;
  pumping = true;
  while (jobs.length) {
    const job = jobs[0];
    updateChip();
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain เพื่อไม่ให้ติด CORS preflight
        body: JSON.stringify({ clientId: job.id, image: job.image })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'upload failed');
      job.queue = data.queue;
      lastQueue = data.queue;
      lastErr = '';
      jobs.shift();
      onQueueIssued(job);
    } catch (e) {
      lastErr = String((e && e.message) || e);
      job.tries++;
      await sleep(Math.min(1500 * job.tries, 10000));
    }
    updateChip();
  }
  pumping = false;
  updateChip();
}

// ====== ชิปสถานะ ======
function updateChip() {
  const dot = $('dot'), text = $('chiptext');
  dot.className = '';
  if (!navigator.onLine) { dot.classList.add('bad'); text.textContent = 'ไม่มีอินเทอร์เน็ต' + (jobs.length ? ' · รอส่ง ' + jobs.length : ''); return; }
  if (jobs.length) {
    dot.classList.add(lastErr ? 'bad' : 'wait');
    text.textContent = 'กำลังส่ง ' + jobs.length + ' รูป' + (lastErr ? ' · ผิดพลาด: ' + lastErr.slice(0, 60) : '');
    return;
  }
  text.textContent = lastQueue ? 'ส่งแล้ว · ล่าสุด #' + lastQueue : 'พร้อมใช้งาน';
}
window.addEventListener('online', () => { updateChip(); pump(); });
window.addEventListener('offline', updateChip);

// ====== เริ่มทำงาน ======
if (APPS_SCRIPT_URL.startsWith('PUT_')) {
  showError('ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL<br>เปิดไฟล์ index.html แล้วใส่ลิงก์ Web App');
} else {
  keepAwake();
  startCamera();
}
</script>
</body>
</html>
